{% extends 'shop/base.html' %}
{% block content %}

<div class="container my-4">
    <h2>Category: {{ category_name }}</h2>
    <div class="row">
        {% for product in product_obj %}
            <div class="col-md-3 mb-4">
                <div class="card h-100 shadow-sm border-0">
                    <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.title }}">
                    <div class="card-body d-flex flex-column">
                        <div id="nm{{ product.id }}" class="card-title">{{ product.title }}</div>
                        <p class="card-text text-muted flex-grow-1">{{ product.description }}</p>
                        <div class="product-price mb-3">${{ product.price }}</div>
                        <div class="product-actions d-flex flex-column gap-2 mt-auto">
                            <button id="{{ product.id }}" data-name="{{ product.title }}" data-price="{{ product.price }}" class="btn btn-add-cart atc w-100 py-2">Add to Cart</button>
                            <a href="{% url 'shop:product_detail' product.id %}" class="btn btn-view-details w-100 py-2 text-center">View Details</a>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>No products found in this category.</p>
        {% endfor %}
    </div>
</div>

{% endblock %}
