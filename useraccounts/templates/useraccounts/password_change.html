{% extends 'shop/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password — ShopSpace{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
    <div class="card auth-card border-0 shadow-sm mx-auto p-4 p-md-5">
        <div class="text-center mb-4">
            <span class="brand-badge mb-3 d-inline-flex"><i class="fas fa-key"></i></span>
            <h3 class="font-weight-bold text-dark mb-1">Update Password</h3>
            <p class="text-muted small">Choose a strong, unique password to protect your account.</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="auth-form-fields mb-4">
                {{ form|crispy }}
            </div>

            <button type="submit" class="btn btn-atc btn-block py-3 font-weight-bold shadow-sm">
                Save New Password
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small">
            <a href="{% url 'useraccounts:profile' %}" class="text-muted text-decoration-none">
                <i class="fas fa-arrow-left mr-1"></i> Cancel & Return to Profile
            </a>
        </div>
    </div>
</div>
{% endblock %}
