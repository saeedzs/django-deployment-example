{% extends "shop/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign In — ShopSpace{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
    <div class="card auth-card border-0 shadow-sm mx-auto p-4 p-md-5">
        <div class="text-center mb-4">
            <span class="brand-badge mb-3 d-inline-flex"><i class="fas fa-arrow-right-to-bracket"></i></span>
            <h3 class="font-weight-bold text-dark mb-1">Welcome Back</h3>
            <p class="text-muted small">Access your order history and account settings.</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="auth-form-fields mb-3">
                {{ form|crispy }}
            </div>

            <button type="submit" class="btn btn-atc btn-block py-3 font-weight-bold shadow-sm">
                Sign In to Account
            </button>
        </form>

        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top small">
            <a href="{% url 'useraccounts:password_reset' %}" class="text-muted text-decoration-none">
                <i class="fas fa-lock-open mr-1"></i> Forgot Password?
            </a>
            <a href="{% url 'useraccounts:register' %}" class="text-primary font-weight-bold text-decoration-none">
                Create Account &rarr;
            </a>
        </div>
    </div>
</div>
{% endblock %}
