{% extends 'shop/base.html' %}

{% block title %}Password Updated — ShopSpace{% endblock %}

{% block content %}
<meta http-equiv="refresh" content="4;url={% url 'useraccounts:profile' %}" />
<div class="auth-wrapper py-5">
    <div class="card auth-card border-0 shadow-sm mx-auto p-4 p-md-5 text-center">
        <div class="zone-icon zone-icon-emerald mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.4rem;">
            <i class="fas fa-circle-check"></i>
        </div>
        
        <h3 class="font-weight-bold text-dark mb-2">Password Changed!</h3>
        <p class="text-muted small mb-4">
            Your security credentials have been updated. Redirecting to your profile in 4 seconds...
        </p>

        <a href="{% url 'useraccounts:profile' %}" class="btn btn-atc rounded-pill px-4 font-weight-bold text-decoration-none">
            Go to Profile Now &rarr;
        </a>
    </div>
</div>
{% endblock %}
