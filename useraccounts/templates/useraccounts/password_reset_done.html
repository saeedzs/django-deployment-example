{% extends 'shop/base.html' %}

{% block title %}Recovery Email Sent — ShopSpace{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
    <div class="card auth-card border-0 shadow-sm mx-auto p-4 p-md-5 text-center">
        <div class="zone-icon zone-icon-sky mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.4rem;">
            <i class="far fa-paper-plane"></i>
        </div>
        
        <h3 class="font-weight-bold text-dark mb-2">Check Your Inbox</h3>
        <p class="text-muted small mb-4">
            We have emailed password reset instructions. If an account matches that address, you will receive it shortly.
        </p>

        <a href="{% url 'shop:index' %}" class="btn btn-outline-secondary rounded-pill px-4 font-weight-bold">
            Return to Storefront
        </a>
    </div>
</div>
{% endblock %}
